<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Personas</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fuente Google Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Estilos para el efecto Glassmorphism (Cristal esmerilado) */
        .tarjeta-cristal {
            background: rgba(18, 18, 28, 0.70);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .subtarjeta-cristal {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        /* Animación para el cambio de número */
        @keyframes pulsoNumero {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
        .animacion-pulso {
            animation: pulsoNumero 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 font-sans text-white min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden selection:bg-pink-500 selection:text-white">

    <!-- Imagen de fondo urbana con capa de superposición oscura -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1920&q=80" 
             alt="Fondo Urbano" 
             class="w-full h-full object-cover opacity-30"
             onerror="this.src='https://images.unsplash.com/photo-1477959858617-67f30ac4ce09?auto=format&fit=crop&w=1920&q=80'">
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/80 to-purple-950/40"></div>
    </div>

    <!-- Contenedor Principal de la Aplicación -->
    <main class="relative z-10 w-full max-w-xl tarjeta-cristal rounded-3xl p-6 sm:p-8 shadow-2xl border border-white/10 my-auto">
        
        <!-- Encabezado de la página -->
        <header class="text-center mb-6 border-b border-white/10 pb-4">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-pink-500 to-purple-600 mb-3 shadow-lg shadow-pink-500/30">
                <i class="fa-solid fa-users text-2xl text-white"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-300 bg-clip-text text-transparent">
                Contador de Personas
            </h1>
        </header>

        <!-- Pantalla del Contador Principal -->
        <section class="text-center my-6 py-6 px-4 rounded-2xl subtarjeta-cristal relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-pink-500/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -left-10 -top-10 w-32 h-32 bg-purple-500/10 rounded-full blur-2xl pointer-events-none"></div>

            <div id="conteo-total" class="text-7xl sm:text-8xl font-black tracking-tight text-white mb-1 transition-transform duration-100">
                0
            </div>
            <p id="etiqueta-total" class="text-lg sm:text-xl font-medium text-pink-300 tracking-wide">
                0 Personas
            </p>
        </section>

        <!-- Desglose por género (Hombres y Mujeres) -->
        <section class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            <!-- Subcontador Hombres -->
            <div class="subtarjeta-cristal p-4 rounded-2xl flex flex-col items-center justify-between transition-all duration-300 hover:border-blue-400/40">
                <div class="flex items-center space-x-2 mb-2">
                    <span class="text-2xl">👨</span>
                    <h2 class="font-semibold text-slate-200">Hombres</h2>
                </div>
                <div id="conteo-hombres" class="text-3xl font-bold text-blue-400 mb-3">0</div>
                <div class="flex items-center gap-2 w-full">
                    <button onclick="actualizarHombres(-1)" class="flex-1 py-2 px-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 active:scale-95 text-slate-200 font-bold transition-all border border-slate-700/50 shadow">
                        -1
                    </button>
                    <button onclick="actualizarHombres(1)" class="flex-1 py-2 px-3 rounded-xl bg-blue-600/80 hover:bg-blue-500 active:scale-95 text-white font-bold transition-all shadow-md shadow-blue-500/20">
                        +1
                    </button>
                </div>
            </div>

            <!-- Subcontador Mujeres -->
            <div class="subtarjeta-cristal p-4 rounded-2xl flex flex-col items-center justify-between transition-all duration-300 hover:border-pink-400/40">
                <div class="flex items-center space-x-2 mb-2">
                    <span class="text-2xl">👩</span>
                    <h2 class="font-semibold text-slate-200">Mujeres</h2>
                </div>
                <div id="conteo-mujeres" class="text-3xl font-bold text-pink-400 mb-3">0</div>
                <div class="flex items-center gap-2 w-full">
                    <button onclick="actualizarMujeres(-1)" class="flex-1 py-2 px-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 active:scale-95 text-slate-200 font-bold transition-all border border-slate-700/50 shadow">
                        -1
                    </button>
                    <button onclick="actualizarMujeres(1)" class="flex-1 py-2 px-3 rounded-xl bg-pink-600/80 hover:bg-pink-500 active:scale-95 text-white font-bold transition-all shadow-md shadow-pink-500/20">
                        +1
                    </button>
                </div>
            </div>
        </section>

        <!-- Botones de Control Principal -->
        <section class="flex flex-col sm:flex-row items-center gap-3">
            <button onclick="agregarPersonaGeneral()" class="w-full sm:flex-1 py-3 px-4 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 active:scale-95 text-white font-bold text-base shadow-lg shadow-pink-500/25 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus"></i> +1 Persona
            </button>
            <button onclick="quitarPersonaGeneral()" class="w-full sm:w-auto py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 font-semibold text-base transition-all border border-slate-700 flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-minus"></i> -1
            </button>
            <button onclick="reiniciarTodo()" class="w-full sm:w-auto py-3 px-4 rounded-xl bg-red-500/20 hover:bg-red-500/30 active:scale-95 text-red-300 font-semibold text-base transition-all border border-red-500/30 flex items-center justify-center gap-2" title="Reiniciar contadores">
                <i class="fa-solid fa-rotate-right"></i> Reiniciar
            </button>
        </section>

        <!-- Mensaje de Notificación de Restricción -->
        <div id="notificacion" class="mt-4 text-center text-xs text-red-400 font-medium opacity-0 transition-opacity duration-300 h-4">
            El contador no puede ser menor a 0.
        </div>
    </main>

    <script>
        // Variables de estado del contador
        let hombres = 0;
        let mujeres = 0;
        let generales = 0; // Para personas agregadas directamente desde el botón global +1

        // Elementos del DOM
        const elementoConteoTotal = document.getElementById('conteo-total');
        const elementoEtiquetaTotal = document.getElementById('etiqueta-total');
        const elementoConteoHombres = document.getElementById('conteo-hombres');
        const elementoConteoMujeres = document.getElementById('conteo-mujeres');
        const elementoNotificacion = document.getElementById('notificacion');

        // Función para activar la animación de pulso en el número principal
        function animarNumero() {
            elementoConteoTotal.classList.remove('animacion-pulso');
            void elementoConteoTotal.offsetWidth; // Forzar un recálculo de estilos
            elementoConteoTotal.classList.add('animacion-pulso');
        }

        // Mostrar un aviso temporal cuando no se pueda restar más
        function mostrarAviso(mensaje = 'El contador no puede ser menor a 0.') {
            elementoNotificacion.textContent = mensaje;
            elementoNotificacion.classList.remove('opacity-0');
            setTimeout(() => {
                elementoNotificacion.classList.add('opacity-0');
            }, 2000);
        }

        // Función de renderizado para actualizar la interfaz visual
        function renderizar() {
            const total = hombres + mujeres + generales;

            // Actualizar números en pantalla
            elementoConteoTotal.textContent = total;
            elementoConteoHombres.textContent = hombres;
            elementoConteoMujeres.textContent = mujeres;

            // Lógica de pluralización en español: 0 Personas, 1 Persona, X Personas
            if (total === 1) {
                elementoEtiquetaTotal.textContent = "1 Persona";
            } else {
                elementoEtiquetaTotal.textContent = `${total} Personas`;
            }

            animarNumero();
        }

        // Incrementar o decrementar el conteo de Hombres
        function actualizarHombres(valor) {
            if (valor < 0 && hombres <= 0) {
                mostrarAviso("No hay hombres registrados para restar.");
                return;
            }
            hombres += valor;
            renderizar();
        }

        // Incrementar o decrementar el conteo de Mujeres
        function actualizarMujeres(valor) {
            if (valor < 0 && mujeres <= 0) {
                mostrarAviso("No hay mujeres registradas para restar.");
                return;
            }
            mujeres += valor;
            renderizar();
        }

        // Botón global de sumar +1 Persona
        function agregarPersonaGeneral() {
            generales += 1;
            renderizar();
        }

        // Botón global de restar -1 Persona (Resta primero de generales, o de hombres/mujeres)
        function quitarPersonaGeneral() {
            const total = hombres + mujeres + generales;
            if (total <= 0) {
                mostrarAviso();
                return;
            }

            if (generales > 0) {
                generales -= 1;
            } else if (hombres > 0) {
                hombres -= 1;
            } else if (mujeres > 0) {
                mujeres -= 1;
            }

            renderizar();
        }

        // Reiniciar todos los contadores a 0
        function reiniciarTodo() {
            hombres = 0;
            mujeres = 0;
            generales = 0;
            renderizar();
        }

        // Inicializar al cargar la página
        window.onload = function() {
            renderizar();
        };
    </script>
</body>
</html>
