 
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Personas - Desarrollo de Interfaces</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts - Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .tarjeta-cristal {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    @keyframes pulsoAnim {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .animar-cambio {
      animation: pulsoAnim 0.2s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen bg-cover bg-center flex items-center justify-center p-4" style="background-image: url('https://images.unsplash.com/photo-1477959858617-67f30bc75b82?q=80&w=1920&auto=format&fit=crop');">
  
  <!-- Overlay oscuro para mejorar contraste -->
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>

  <!-- Contenedor Principal -->
  <main class="relative z-10 w-full max-w-md tarjeta-cristal rounded-3xl p-6 shadow-2xl text-white">
    
    <!-- Cabecera -->
    <header class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-indigo-500/30 border border-indigo-400/30 mb-2 shadow-inner">
        <i class="fa-solid fa-users text-indigo-300 text-xl"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight">Control de Aforo</h1>
      <p class="text-xs text-gray-300 mt-1">Desarrollo de Interfaces - Práctica</p>
    </header>

    <!-- Configuración del Aforo Máximo -->
    <div class="mb-5 bg-white/5 p-3 rounded-xl border border-white/10">
      <label for="aforoMax" class="block text-xs font-medium text-gray-300 mb-1">
        <i class="fa-solid fa-sliders mr-1 text-indigo-400"></i> Aforo Máximo Permitido:
      </label>
      <input type="number" id="aforoMax" value="50" min="1" 
             class="w-full px-3 py-1.5 bg-black/30 border border-white/20 rounded-lg text-white font-semibold text-center focus:outline-none focus:ring-2 focus:ring-indigo-400 text-sm">
    </div>

    <!-- Visor Principal del Conteo -->
    <div class="text-center bg-white/5 rounded-2xl p-5 border border-white/10 mb-6 shadow-inner">
      <span class="text-xs uppercase tracking-wider text-gray-300 font-medium">Total de Personas</span>
      <div id="contadorTotal" class="text-5xl font-extrabold my-2 text-indigo-300 tracking-tight">0</div>
      <div id="textoPlural" class="text-sm font-medium text-gray-200">0 Personas</div>
    </div>

    <!-- Subcontadores por Género -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <!-- Tarjeta Hombres -->
      <div class="bg-white/5 rounded-xl p-3 border border-white/10 text-center">
        <span class="text-xs text-blue-300 font-medium block mb-1"><i class="fa-solid fa-mars mr-1"></i> Hombres</span>
        <div id="contadorHombres" class="text-2xl font-bold mb-2">0</div>
        <div class="flex justify-center gap-2">
          <button onclick="cambiarHombres(-1)" class="w-8 h-8 rounded-lg bg-red-500/20 hover:bg-red-500/40 border border-red-500/30 text-red-200 font-bold transition flex items-center justify-center">-</button>
          <button onclick="cambiarHombres(1)" class="w-8 h-8 rounded-lg bg-blue-500/20 hover:bg-blue-500/40 border border-blue-500/30 text-blue-200 font-bold transition flex items-center justify-center">+</button>
        </div>
      </div>

      <!-- Tarjeta Mujeres -->
      <div class="bg-white/5 rounded-xl p-3 border border-white/10 text-center">
        <span class="text-xs text-pink-300 font-medium block mb-1"><i class="fa-solid fa-venus mr-1"></i> Mujeres</span>
        <div id="contadorMujeres" class="text-2xl font-bold mb-2">0</div>
        <div class="flex justify-center gap-2">
          <button onclick="cambiarMujeres(-1)" class="w-8 h-8 rounded-lg bg-red-500/20 hover:bg-red-500/40 border border-red-500/30 text-red-200 font-bold transition flex items-center justify-center">-</button>
          <button onclick="cambiarMujeres(1)" class="w-8 h-8 rounded-lg bg-pink-500/20 hover:bg-pink-500/40 border border-pink-500/30 text-pink-200 font-bold transition flex items-center justify-center">+</button>
        </div>
      </div>
    </div>

    <!-- Controles Principales / Globales -->
    <div class="space-y-2.5">
      <button onclick="sumarGlobal()" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-user-plus"></i> Añadir Persona (+1)
      </button>

      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="restarGlobal()" class="py-2.5 px-3 bg-white/10 hover:bg-white/20 border border-white/10 text-white font-medium rounded-xl transition flex items-center justify-center gap-1.5 text-sm">
          <i class="fa-solid fa-user-minus"></i> Quitar (-1)
        </button>
        <button onclick="reiniciarTodo()" class="py-2.5 px-3 bg-red-500/20 hover:bg-red-500/30 border border-red-500/20 text-red-200 font-medium rounded-xl transition flex items-center justify-center gap-1.5 text-sm">
          <i class="fa-solid fa-rotate-right"></i> Reiniciar
        </button>
      </div>
    </div>

    <!-- Área de Notificaciones / Avisos -->
    <div id="notificacion" class="mt-4 text-center text-xs text-red-300 font-medium min-h-[20px] transition-all"></div>

  </main>

  <!-- Script JavaScript -->
  <script>
    let hombres = 0;
    let mujeres = 0;
    let generales = 0;

    const elTotal = document.getElementById('contadorTotal');
    const elTextoPlural = document.getElementById('textoPlural');
    const elHombres = document.getElementById('contadorHombres');
    const elMujeres = document.getElementById('contadorMujeres');
    const elAforoMax = document.getElementById('aforoMax');
    const elNotificacion = document.getElementById('notificacion');

    function mostrarAviso(mensaje) {
      elNotificacion.textContent = mensaje;
      setTimeout(() => {
        if (elNotificacion.textContent === mensaje) {
          elNotificacion.textContent = '';
        }
      }, 3500);
    }

    function verificarAforo(cantidadASumar) {
      const aforoMax = parseInt(elAforoMax.value) || 100;
      const totalActual = hombres + mujeres + generales;
      if (totalActual + cantidadASumar > aforoMax) {
        mostrarAviso(`⚠️ ¡Aforo máximo (${aforoMax}) alcanzado! No se permite la entrada.`);
        return false;
      }
      return true;
    }

    function renderizar() {
      const total = hombres + mujeres + generales;
      
      elTotal.textContent = total;
      elHombres.textContent = hombres;
      elMujeres.textContent = mujeres;

      // Lógica de pluralización en español
      if (total === 1) {
        elTextoPlural.textContent = "1 Persona";
      } else {
        elTextoPlural.textContent = `${total} Personas`;
      }

      // Animación visual de pulso
      elTotal.classList.add('animar-cambio');
      setTimeout(() => elTotal.classList.remove('animar-cambio'), 200);
    }

    function sumarGlobal() {
      if (!verificarAforo(1)) return;
      generales++;
      renderizar();
    }

    function cambiarHombres(cantidad) {
      if (cantidad > 0 && !verificarAforo(1)) return;
      if (hombres + cantidad < 0) {
        mostrarAviso("El contador de hombres no puede bajar de 0.");
        return;
      }
      hombres += cantidad;
      renderizar();
    }

    function cambiarMujeres(cantidad) {
      if (cantidad > 0 && !verificarAforo(1)) return;
      if (mujeres + cantidad < 0) {
        mostrarAviso("El contador de mujeres no puede bajar de 0.");
        return;
      }
      mujeres += cantidad;
      renderizar();
    }

    function restarGlobal() {
      if (generales > 0) {
        generales--;
      } else if (mujeres > 0) {
        mujeres--;
      } else if (hombres > 0) {
        hombres--;
      } else {
        mostrarAviso("El aforo ya está a 0.");
        return;
      }
      renderizar();
    }

    function reiniciarTodo() {
      hombres = 0;
      mujeres = 0;
      generales = 0;
      elNotificacion.textContent = '';
      renderizar();
    }

    // Carga inicial
    window.onload = () => {
      renderizar();
    };
  </script>
</body>
</html>
